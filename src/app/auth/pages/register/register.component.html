<div class="register-wrapper">
  <div class="register-container">
    <div class="register-card">
      <div class="register-header">
        <h3>Únete a nuestra comunidad</h3>
        <p>Crea tu cuenta y comienza a financiar proyectos increíbles</p>
      </div>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
        <!-- Información Personal -->
        <section>
          <h3>Información Personal</h3>
          <div formGroupName="userInfo" class="form-grid">
            <div class="form-group">
              <label for="firstName">Nombre *</label>
              <input formControlName="firstName" id="firstName" name="firstName" placeholder="Tu nombre" required>
            </div>
            <div class="form-group">
              <label for="lastName">Apellido *</label>
              <input formControlName="lastName" id="lastName" name="lastName" placeholder="Tu apellido" required>
            </div>
          </div>

          <div formGroupName="userInfo" class="form-group">
            <label for="email">Correo Electrónico *</label>
            <input formControlName="email" id="email" type="email" name="email" placeholder="tu@email.com" required>
          </div>

          <div formGroupName="userInfo" class="form-group">
            <label for="phone">Teléfono *</label>
            <input formControlName="phone" id="phone" type="tel" name="phone" placeholder="+57 (321) 123-4567" required>
          </div>
        </section>

        <!-- Información de Cuenta -->
        <section>
          <h3>Información de Cuenta</h3>
          <div formGroupName="userInfo" class="form-group">
            <label for="userName">Nombre de Usuario *</label>
            <input formControlName="userName" id="userName" name="userName" placeholder="@tunombredeusuario" required>
          </div>

          <div formGroupName="userInfo" class="form-group password-group">
            <label for="password">Contraseña *</label>
            <input formControlName="password" [type]="showPassword() ? 'text' : 'password'" id="password"
              name="password" placeholder="Mínimo 8 caracteres" required>
            <button (click)="setShowPassword()" type="button" class="toggle-password">
              <lucide-icon [name]="showPassword() ? 'eye' : 'eye-off'" class="icon"></lucide-icon>
            </button>
          </div>
        </section>

        <!-- Sobre Ti -->
        <section>
          <h3>Sobre Ti</h3>
          <div formGroupName="userInfo" class="form-group">
            <label for="description">Descripción Personal</label>
            <textarea formControlName="description" id="description" name="description"
              placeholder="Cuéntanos un poco sobre ti y tus intereses..."></textarea>
          </div>
        </section>

        <!-- Categorías de Interés -->
        <section>
          <h3>Categorías de Interés</h3>
          <div formGroupName="user" class="checkbox-grid">
            <label *ngFor="let categoria of categories">
              <input type="checkbox" [value]="categoria.id" (change)="onCategoryChange($event)"
                [checked]="isCategorySelected(categoria.id)">
              {{ categoria.name }}
            </label>
          </div>
        </section>

        <!-- Términos -->
        <div class="terms">
          <input id="terms" type="checkbox" required>
          <label for="terms">
            Acepto los <a href="#">términos y condiciones</a> y la
            <a href="#">política de privacidad</a>
          </label>
        </div>

        <!-- Botón y enlace -->
        <button type="submit" class="submit-btn">Crear Cuenta</button>
        <p class="login-link">
          ¿Ya tienes una cuenta?
          <a routerLink="/auth/login">Inicia sesión aquí</a>
        </p>
      </form>

    </div>
  </div>
</div>
